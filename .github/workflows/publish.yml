name: publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    name: Publish @javinfo/mcp to npm
    runs-on: ubuntu-latest
    # Auto-publish guard: always allow manual dispatch; push-trigger gated behind PUBLISH_ENABLED=true
    if: ${{ github.event_name == 'workflow_dispatch' || vars.PUBLISH_ENABLED == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::secrets.NPM_TOKEN is not set"
            exit 1
          fi
          cat <<EOF > ~/.npmrc
          @javinfo:registry=https://registry.npmjs.org/
          //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          EOF

      - name: Configure git identity
        run: |
          git config user.name "javinfo"
          git config user.email "admin@javinfo.dev"

      - name: Install dependencies
        run: bun install

      - name: Run release-it
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx release-it --ci
